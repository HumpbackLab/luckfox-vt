[app]
name = ipc_lite
log_level = INFO
stats_interval_sec = 1
enable_preflight = false
enable_health_restart = false

[isp]
enable_aiq = true
cam_id = 0
hdr_mode = 0
iq_dir = /oem/usr/share/iqfiles

[video]
width = 1920
height = 1080
max_width = 1920
max_height = 1080
fps = 60
gop = 60
bitrate_kbps = 8192
codec = h264
vi_channel = 1
venc_channel = 1
input_buffer_count = 2
venc_buffer_count = 2
venc_buffer_size = 3133440
enable_refer_buffer_share = true
venc_timeout_ms = 200
sync_sensor_fps = true
scene_mode = ipc
enable_motion_deblur = false
motion_deblur_strength = 3
enable_motion_static_switch = false
enable_slice_split = false
slice_split_mode = 0
slice_split_size = 0
max_stream_count = 1
poll_wakeup_frame_count = 1
request_idr_on_start = true
request_idr_on_rtsp_enable = false

[output.file]
enable = false
path = /tmp/ipc_lite.h264

[output.rtsp]
enable = false
port = 554
path = /live/0

[output.rtmp]
enable = false
url = rtmp://127.0.0.1:1935/live/mainstream

[output.udp_rtp]
enable = true
host = 192.168.3.2
port = 5600
payload_type = 96
mtu = 1200

[wifi]
enable_status = false
ifname = wlan0

[debug]
dump_first_frames = 5
