[app]
name = ipc_lite
log_level = INFO
stats_interval_sec = 2

[isp]
enable_aiq = true
cam_id = 0
hdr_mode = 0
iq_dir = /oem/usr/share/iqfiles

[video]
width = 704
height = 576
max_width = 704
max_height = 576
fps = 25
gop = 50
bitrate_kbps = 512
codec = h265
vi_channel = 1
venc_channel = 1
input_buffer_count = 2
venc_buffer_count = 4
venc_buffer_size = 202752
enable_refer_buffer_share = true
venc_timeout_ms = 1000

[output.file]
enable = true
path = /tmp/ipc_lite.h265

[output.rtsp]
enable = false
port = 554
path = /live/0

[output.rtmp]
enable = false
url = rtmp://127.0.0.1:1935/live/mainstream

[wifi]
enable_status = true
ifname = wlan0

[debug]
dump_first_frames = 5
