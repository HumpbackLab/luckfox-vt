[app]
name = ipc_lite
log_level = INFO
stats_interval_sec = 2

[isp]
enable_aiq = true
cam_id = 0
hdr_mode = 0
iq_dir = /oem/usr/share/iqfiles

[video]
width = 1280
height = 720
fps = 25
gop = 50
bitrate_kbps = 2048
codec = h264
vi_channel = 0
venc_channel = 0
venc_timeout_ms = 1000

[output.file]
enable = true
path = /tmp/ipc_lite.h264

[output.rtsp]
enable = false
port = 554
path = /live/0

[output.rtmp]
enable = false
url = rtmp://127.0.0.1:1935/live/mainstream

[wifi]
enable_status = true
ifname = wlan0

[debug]
dump_first_frames = 5

