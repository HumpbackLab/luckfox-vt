[app]
name = ipc_lite
log_level = INFO
stats_interval_sec = 2

[isp]
enable_aiq = true
cam_id = 0
hdr_mode = 0
iq_dir = /oem/usr/share/iqfiles

[video]
width = 1280
height = 720
max_width = 1280
max_height = 720
fps = 25
gop = 25
bitrate_kbps = 3072
codec = h264
vi_channel = 1
venc_channel = 1
input_buffer_count = 2
venc_buffer_count = 4
venc_buffer_size = 1382400
enable_refer_buffer_share = true
venc_timeout_ms = 1000
sync_sensor_fps = true
scene_mode = cvr
enable_motion_deblur = false
motion_deblur_strength = 3
enable_motion_static_switch = false
enable_slice_split = false
slice_split_mode = 0
slice_split_size = 0
max_stream_count = 1
poll_wakeup_frame_count = 1
request_idr_on_start = true
request_idr_on_rtsp_enable = true

[output.file]
enable = false
path = /tmp/ipc_lite.h264

[output.rtsp]
enable = true
port = 554
path = /live/0

[output.rtmp]
enable = false
url = rtmp://127.0.0.1:1935/live/mainstream

[wifi]
enable_status = true
ifname = wlan0

[debug]
dump_first_frames = 5
